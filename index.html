<html lang="en">
<head>
<meta charset="UTF-8">

<title>Satellite Tracker · 10,000 Offline Fleet</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet">


<style>
  :root {
    --bg: #050a09;
    --accent: #00ffcc;
    --accent-dim: rgba(0, 255, 204, 0.14);
    --panel-bg: rgba(6, 14, 13, 0.88);
    --border: rgba(255, 255, 255, 0.12);
    --text: #d8f5ee;
    --text-dim: #7fa89c;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: var(--sans);
    color: var(--text);
    overflow: hidden;
  }

  #cesiumContainer {
    position: absolute;
    inset: 0;
  }

  /* A subtle deep-space layer behind Cesium. It adds depth without washing
     out the Earth or satellite markers. */
  #spaceBackdrop {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 44%, rgba(22, 86, 120, 0.13) 0%, rgba(5, 10, 9, 0) 34%),
      radial-gradient(circle at 18% 22%, rgba(0, 255, 204, 0.055) 0 1px, transparent 1.5px),
      radial-gradient(circle at 76% 17%, rgba(255, 255, 255, 0.07) 0 1px, transparent 1.5px),
      radial-gradient(circle at 88% 72%, rgba(0, 180, 255, 0.055) 0 1px, transparent 1.5px),
      radial-gradient(circle at 31% 81%, rgba(255, 255, 255, 0.05) 0 1px, transparent 1.5px);
    background-size: auto, 170px 170px, 230px 230px, 260px 260px, 310px 310px;
    mix-blend-mode: screen;
    opacity: 0.75;
  }


  /* Deep-space star field */
  #starfield-layer {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
    opacity: 0.92;
  }

  #starfield-layer::before,
  #starfield-layer::after {
    content: "";
    position: absolute;
    inset: -10%;
    background-repeat: repeat;
    mix-blend-mode: screen;
  }

  /* Fine distant stars */
  #starfield-layer::before {
    background-image:
      radial-gradient(circle, rgba(255,255,255,.92) 0 0.65px, transparent 1px),
      radial-gradient(circle, rgba(190,225,255,.72) 0 0.55px, transparent 1px),
      radial-gradient(circle, rgba(255,255,255,.62) 0 0.45px, transparent 0.9px);
    background-size: 83px 91px, 137px 149px, 191px 173px;
    background-position: 13px 21px, 47px 71px, 101px 37px;
    opacity: .78;
  }

  /* Occasional brighter stars */
  #starfield-layer::after {
    background-image:
      radial-gradient(circle, rgba(255,255,255,.98) 0 1.15px, rgba(180,225,255,.45) 1.7px, transparent 3px),
      radial-gradient(circle, rgba(255,255,255,.9) 0 .9px, rgba(160,215,255,.32) 1.5px, transparent 2.7px);
    background-size: 263px 241px, 389px 337px;
    background-position: 71px 29px, 173px 113px;
    opacity: .52;
  }

  .star-twinkle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 7px 1px rgba(180,225,255,.72);
    animation: starTwinkle 3.8s ease-in-out infinite;
  }

  .star-twinkle:nth-child(2n) {
    width: 2px;
    height: 2px;
    animation-duration: 5.2s;
  }

  .star-twinkle:nth-child(3n) {
    animation-delay: 1.2s;
  }

  @keyframes starTwinkle {
    0%, 100% { opacity: .28; transform: scale(.75); }
    50% { opacity: 1; transform: scale(1.35); }
  }

  #screenVignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0, 0, 0, 0.30) 100%);
  }

  .app-title {
    position: fixed;
    left: 18px;
    top: 58px;
    z-index: 20;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(216, 245, 238, 0.68);
  }

  .app-title span {
    color: var(--accent);
  }

  /* Cesium's own credit/attribution strip — keep it, just quiet it down */
  .cesium-viewer-bottom {
    filter: opacity(0.6);
  }

  .chip {
    position: fixed;
    z-index: 20;
    background: linear-gradient(180deg, rgba(8, 19, 18, 0.91), rgba(5, 12, 14, 0.82));
    border: 1px solid rgba(0, 255, 204, 0.18);
    border-radius: 8px;
    padding: 9px 13px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    backdrop-filter: blur(6px);
  }

  .chip--status {
    top: 16px;
    left: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.20);
  }

  .search-bar {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    gap: 6px;
  }

  .search-bar input {
    width: 310px;
    background: rgba(5, 14, 16, 0.90);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 9px;
    padding: 8px 12px;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--text);
    outline: none;
  }

  .search-bar input:focus {
    border-color: var(--accent);
  }

  .search-bar input::placeholder {
    color: var(--text-dim);
  }

  .search-bar button {
    background: linear-gradient(180deg, rgba(0,255,204,.20), rgba(0,255,204,.09));
    border: 1px solid rgba(0,255,204,.65);
    border-radius: 9px;
    padding: 8px 14px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    cursor: pointer;
  }

  .search-bar button:hover {
    background: rgba(0, 255, 204, 0.24);
  }

  .camera-controls {
    position: fixed;
    right: 16px;
    top: 14px;
    z-index: 25;
    display: flex;
    gap: 5px;
  }

  .camera-controls button {
    width: 40px;
    height: 36px;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 9px;
    background: rgba(5, 14, 16, 0.90);
    color: var(--accent);
    font-family: var(--sans);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }

  .camera-controls button:hover {
    background: var(--accent-dim);
    border-color: var(--accent);
  }

  .camera-controls #earthView {
    font-size: 18px;
  }

  .panel {
    display: none;
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 20;
    width: 270px;
    background: linear-gradient(180deg, rgba(7, 18, 18, 0.94), rgba(4, 11, 14, 0.86));
    border: 1px solid rgba(0,255,204,0.18);
    border-radius: 12px;
    padding: 16px;
    backdrop-filter: blur(12px);
    box-shadow: 0 18px 45px rgba(0,0,0,.28);
  }

  .panel__header {
    font-size: 14px;
    color: #effffb;
    font-weight: 600;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    word-break: break-word;
  }

  .panel__row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    padding: 4px 0;
    color: var(--text-dim);
  }

  .panel__row strong {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
  }

  .hover-label {
    display: none;
    position: fixed;
    z-index: 30;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 4px 8px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
    background: rgba(5, 10, 18, 0.96);
    pointer-events: none;
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--bg);
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

    .selected-orbit-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 223, 50, 0.14);
      border: 1px solid rgba(255, 239, 130, 0.55);
      color: #fff3a0;
      font-size: 11px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

  @media (max-width: 720px) {
    .search-bar { width: calc(100% - 32px); }
    .search-bar input { width: 100%; }
    .app-title { display: none; }
    .panel { left: 16px; right: 16px; bottom: 16px; width: auto; }
  }

</style>

<body>

  <span class="star-twinkle" style="left:43%;top:83%;animation-delay:3.1s"></span>

  <div class="panel__row"><span>Latitude</span><strong id="latitude">—</strong></div>

  <div class="panel__row"><span>Speed</span><strong id="speed">—</strong></div>
</div>

<script>
  /*
   * ASSUMED DEFAULTS — swap these for your real project's values
   * -------------------------------------------------------------
   * - CURRENT_GROUP / fetchSatellites(): points at CelesTrak's public
   *   GP data feed. Change GROUP below to whatever set you were using
   *   ('active', 'starlink', 'gps-ops', etc). 'stations' is small and
   *   fast, good for testing.
   * - 'active' currently returns 15,000+ objects. That's a lot of SGP4
   *   propagation if it's recomputed every render frame, so the real
   *   fix for smoothness at that scale is POSITION_UPDATE_INTERVAL_MS
   *   below (throttled recompute) rather than capping the count.
   * - Viewer uses a token-free OpenStreetMap basemap so this runs with
   *   no Cesium Ion account. If you have an Ion token, set it below
   *   and swap the baseLayer for Cesium's own imagery/terrain.
   */
  const CURRENT_GROUP = 'active';

  // If either library failed to load (CDN blocked by network/firewall/
  // ad-blocker, or just still loading when this ran), everything below
  // would throw immediately and the page would hang on the spinner
  // forever with no explanation. Fail loudly instead.
  if (typeof Cesium === 'undefined') {
    document.getElementById('loading').innerHTML =
      '<p>Cesium failed to load from cesium.com.</p>' +
      '<p style="font-size:12px;opacity:0.7;margin-top:8px">Check your network connection, or whether an ad-blocker/firewall is blocking cesium.com.</p>';
    throw new Error('Cesium.js did not load');
  }


  // -----------------------------------------------------------------------
  // LOCAL SATELLITE PROPAGATOR
  // -----------------------------------------------------------------------
  // The previous builds depended on satellite.js from jsdelivr.net. When
  // that CDN was unavailable, the whole satellite engine stopped. This
  // lightweight two-body propagator parses the TLE orbital elements locally,
  // so the tracker can still display and animate the catalog.
  const satellite = (() => {
    const MU = 398600.4418;       // km^3/s^2
    const EARTH_RADIUS_KM = 6378.137;

    function dayOfYearToDate(year, day) {
      const fullYear = year < 57 ? 2000 + year : 1900 + year;
      const d = new Date(Date.UTC(fullYear, 0, 1));
      d.setUTCDate(d.getUTCDate() + Math.floor(day) - 1);
      d.setUTCMilliseconds((day - Math.floor(day)) * 86400000);
      return d;
    }

    function twoline2satrec(line1, line2) {
      const inc = Number(line2.slice(8, 16)) * Math.PI / 180;
      const raan = Number(line2.slice(17, 25)) * Math.PI / 180;
      const ecc = Number('0.' + line2.slice(26, 33).trim());
      const argp = Number(line2.slice(34, 42)) * Math.PI / 180;
      const meanAnomaly = Number(line2.slice(43, 51)) * Math.PI / 180;
      const revPerDay = Number(line2.slice(52, 63));
      const year = Number(line1.slice(18, 20));
      const day = Number(line1.slice(20, 32));

      const epoch = dayOfYearToDate(year, day);
      const n = revPerDay * 2 * Math.PI / 86400;
      const a = Math.cbrt(MU / (n * n));

      return { inclination: inc, raan, eccentricity: ecc, argp,
               meanAnomaly, revPerDay, n, a, epoch };
    }

    function solveKepler(M, e) {
      let E = M;
      for (let i = 0; i < 8; i++) {
        E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
      }
      return E;
    }

    function propagate(satrec, date) {
      const dt = (date.getTime() - satrec.epoch.getTime()) / 1000;
      const M = (satrec.meanAnomaly + satrec.n * dt) % (2 * Math.PI);
      const E = solveKepler(M, Math.max(0, Math.min(0.99, satrec.eccentricity)));

      const e = satrec.eccentricity;
      const a = satrec.a;
      const nu = 2 * Math.atan2(
        Math.sqrt(1 + e) * Math.sin(E / 2),
        Math.sqrt(1 - e) * Math.cos(E / 2)
      );
      const r = a * (1 - e * Math.cos(E));

      const xOrb = r * Math.cos(nu);
      const yOrb = r * Math.sin(nu);

      const cO = Math.cos(satrec.raan), sO = Math.sin(satrec.raan);
      const ci = Math.cos(satrec.inclination), si = Math.sin(satrec.inclination);
      const cw = Math.cos(satrec.argp), sw = Math.sin(satrec.argp);

      const x = (cO*cw - sO*sw*ci)*xOrb + (-cO*sw - sO*cw*ci)*yOrb;
      const y = (sO*cw + cO*sw*ci)*xOrb + (-sO*sw + cO*cw*ci)*yOrb;
      const z = (sw*si)*xOrb + (cw*si)*yOrb;

      // Velocity is only needed for the telemetry panel.
      const p = Math.sqrt(MU * a) / r;
      const vxOrb = -p * Math.sin(E);
      const vyOrb = p * Math.sqrt(1 - e*e) * Math.cos(E);

      const vx = (cO*cw - sO*sw*ci)*vxOrb + (-cO*sw - sO*cw*ci)*vyOrb;
      const vy = (sO*cw + cO*sw*ci)*vxOrb + (-sO*sw + cO*cw*ci)*vyOrb;
      const vz = (sw*si)*vxOrb + (cw*si)*vyOrb;

      return {
        position: { x, y, z },
        velocity: { x: vx, y: vy, z: vz }
      };
    }

    function gstime(date) {
      const JD = date.getTime() / 86400000 + 2440587.5;
      const T = (JD - 2451545.0) / 36525;
      let theta = 67310.54841 +
        (876600 * 3600 + 8640184.812866) * T +
        0.093104 * T*T -
        6.2e-6 * T*T*T;
      theta = (theta * Math.PI / 180) % (2 * Math.PI);
      return theta < 0 ? theta + 2 * Math.PI : theta;
    }

    function eciToGeodetic(position, gmst) {
      const x = position.x, y = position.y, z = position.z;
      const cosG = Math.cos(gmst), sinG = Math.sin(gmst);
      const xe = cosG*x + sinG*y;
      const ye = -sinG*x + cosG*y;

      const lon = Math.atan2(ye, xe);
      const p = Math.sqrt(xe*xe + ye*ye);
      const lat = Math.atan2(z, p);
      const height = Math.sqrt(xe*xe + ye*ye + z*z) - EARTH_RADIUS_KM;

      return { longitude: lon, latitude: lat, height };
    }

    return { twoline2satrec, propagate, gstime, eciToGeodetic };
  })();

  // How often (ms of real time) each satellite's on-screen position is
  // recomputed. Orbital motion is slow relative to a render frame, so
  // recalculating SGP4 for 15,000 satellites at 60fps is mostly wasted
  // work - throttling to a few times a second is visually identical for
  // orbital speeds and is what makes the full catalog feel smooth instead
  // of 15,000 propagations competing for the main thread every frame.
  const POSITION_UPDATE_INTERVAL_MS = 700;

  let satellites = [];
  let entities = [];

  // Optional: paste a free Cesium ion access token below (get one at
  // https://ion.cesium.com/tokens) to switch to Cesium's own photorealistic
  // satellite/aerial imagery - real terrain texture, coastlines, city
  // lights, the kind of imagery you'd actually recognize your own country
  // in. Leave this blank to keep the free, token-free OpenStreetMap
  // basemap, which is map-style (borders and labels) rather than
  // photographic.
  const CESIUM_ION_TOKEN = '';

  const viewerOptions = {
    baseLayerPicker: false,
    geocoder: false,
    homeButton: false,
    sceneModePicker: false,
    navigationHelpButton: false,
    animation: false,
    timeline: false,
    fullscreenButton: false,
    infoBox: false,
    selectionIndicator: false,
    terrainProvider: new Cesium.EllipsoidTerrainProvider()
  };

  // Keep the globe itself independent of an imagery server.  This guarantees
  // that Earth remains visible even when an imagery CDN is blocked/offline.
  // Imagery is added separately as an enhancement when it can be loaded.
  const viewer = new Cesium.Viewer('cesiumContainer', viewerOptions);

  // Prevent a single WebGL/texture problem from replacing the whole scene with
  // Cesium's generic "An error occurred while rendering" screen.
  viewer.scene.rethrowRenderErrors = false;
  viewer.scene.renderError.addEventListener((error) => {
    console.error('Cesium render warning:', error);
    const status = document.getElementById('status');
    if (status && !status.innerText.includes('render warning')) {
      status.innerText += ' · render warning — globe kept active';
    }
  });

  viewer.scene.globe.show = true;
  viewer.scene.globe.enableLighting = true;
  viewer.scene.skyAtmosphere.brightnessShift = 0.55;
  viewer.scene.skyAtmosphere.saturationShift = 0.12;
  viewer.scene.globe.enableLighting = true;
  viewer.scene.skyAtmosphere.brightnessShift = 0.55;
  viewer.scene.skyAtmosphere.saturationShift = 0.12;
  viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#0b3150');
  viewer.scene.globe.showWaterEffect = true;
  viewer.scene.globe.showGroundAtmosphere = true;
  viewer.scene.globe.atmosphereLightIntensity = 0.65;
  viewer.scene.globe.atmosphereHueShift = -0.05;
  viewer.scene.globe.atmosphereSaturationShift = 0.05;
  viewer.scene.globe.atmosphereBrightnessShift = 0.05;
  viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#010308');
  viewer.scene.skyBox.show = true;
  viewer.scene.globe.depthTestAgainstTerrain = false;

  // Use Cesium's bundled Natural Earth II imagery. This contains real-world
  // continent/coastline geography and does not require an external map server.
  try {
    const imageryProvider = new Cesium.TileMapServiceImageryProvider({
      url: Cesium.buildModuleUrl('Assets/Textures/NaturalEarthII')
    });
    viewer.imageryLayers.addImageryProvider(imageryProvider);
  } catch (e) {
    console.warn('Bundled Earth imagery unavailable; using the built-in globe.', e);
  }

  // CelesTrak enforces one request per GROUP per IP every 2 hours - a
  // second fetch inside that window gets HTTP 403 with "Data is updated
  // once every 2 hours." Shared public proxies (like the allorigins
  // fallback below) get hit by many different apps, so they exhaust that
  // window constantly; even your own reloads can trip it. Caching locally
  // on the same cadence CelesTrak already updates on means most loads
  // never need the network at all, and a failed fetch can fall back to
  // whatever was last fetched instead of a dead end.
  const CACHE_KEY = `celestrak_tle_${CURRENT_GROUP}`;
  const CACHE_MAX_AGE_MS = 2 * 60 * 60 * 1000;

  function readCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed.tleText || !parsed.fetchedAt || !looksLikeTleData(parsed.tleText)) return null;
      return parsed;
    } catch (e) {
      return null; // localStorage unavailable (private mode, etc.) - just skip caching.
    }
  }

  function writeCache(tleText) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ tleText, fetchedAt: Date.now() }));
    } catch (e) {
      // Storage full or unavailable - not fatal, just no cache for next load.
    }
  }

  function formatCacheAge(fetchedAt) {
    const minutes = Math.round((Date.now() - fetchedAt) / 60000);
    if (minutes < 1) return 'just now';
    if (minutes < 60) return `${minutes}m ago`;
    return `${Math.round(minutes / 60)}h ago`;
  }

  // A 200 OK with a non-empty body isn't necessarily real TLE data - it
  // could be an HTML error page, a proxy failure page, or CelesTrak's own
  // rate-limit message, all of which would otherwise sail through and
  // silently produce zero parsed satellites with no visible error at all.
  function looksLikeTleData(text) {
    const line1Count = (text.match(/^1 \d{5}/gm) || []).length;
    const line2Count = (text.match(/^2 \d{5}/gm) || []).length;
    return line1Count > 5 && line2Count > 5;
  }

  async function fetchLiveTleText() {
    const urls = [
      `https://celestrak.org/NORAD/elements/gp.php?GROUP=${encodeURIComponent(CURRENT_GROUP)}&FORMAT=tle`,
      `https://celestrak.com/NORAD/elements/gp.php?GROUP=${encodeURIComponent(CURRENT_GROUP)}&FORMAT=tle`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://celestrak.org/NORAD/elements/gp.php?GROUP=${encodeURIComponent(CURRENT_GROUP)}&FORMAT=tle`)}`
    ];
    let lastError = null;
    for (const url of urls) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 50000);
        let response;
        try {
          response = await fetch(url, { cache: 'no-store', signal: controller.signal });
        } finally {
          clearTimeout(timeoutId);
        }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        if (!looksLikeTleData(text)) throw new Error('No usable TLE data');
        return text;
      } catch (err) {
        lastError = err;
        console.warn('Live satellite feed skipped:', url, err);
      }
    }
    throw lastError || new Error('Live feed unavailable');
  }

  // Render a capped number of satellites. The full catalog is still searchable,
  // but only this many 3D point entities are drawn at once for smooth performance.
  const MAX_VISIBLE_SATELLITES = 16000;
  // When the network is unavailable, expand the small embedded real-TLE set
  // into a much larger OFFLINE VISUAL FLEET. These are phase-shifted visual
  // copies of the embedded orbital records, not additional real spacecraft.
  const OFFLINE_VISUAL_FLEET_SIZE = 16000;
  const ORBIT_SAMPLE_COUNT = 360;
  const ORBIT_UPDATE_INTERVAL_MS = 3000;

  function createSatelliteEntity(satData, index) {
    const entity = viewer.entities.add({
      satelliteData: satData,
      id: `sat-${satData.noradId}-${index}`,
      name: satData.name,
      position: new Cesium.CallbackProperty(() => {
        const nowMs = performance.now();
        if (
          satData.cachedPosition === undefined ||
          nowMs - satData.lastUpdateMs >= POSITION_UPDATE_INTERVAL_MS
        ) {
          const nextPosition = getSatellitePositionNow(satData.satrec);
          if (nextPosition) satData.cachedPosition = nextPosition;
          satData.lastUpdateMs = nowMs;
        }
        return satData.cachedPosition;
      }, false),
      point: {
        pixelSize: 7.5,
        scaleByDistance: new Cesium.NearFarScalar(1.0e6, 1.25, 2.5e7, 0.55),
        translucencyByDistance: undefined,
        color: Cesium.Color.WHITE.withAlpha(1.0),
        outlineColor: Cesium.Color.TRANSPARENT,
        outlineWidth: 0,
        disableDepthTestDistance: Number.POSITIVE_INFINITY
      },
      label: {
        text: satData.name,
        font: '10px IBM Plex Mono, monospace',
        show: false,
        disableDepthTestDistance: Number.POSITIVE_INFINITY
      }
    });

    satData.entity = entity;
    entity.satData = satData;
    entities.push(entity);
    return entity;
  }


  // Keep the full 10,000-point offline fleet, but reduce visual density when
  // the camera is far away. Zooming in progressively reveals the complete
  // fleet, keeping the Earth view crisp instead of turning into a white cloud.
  let lastFleetDensityUpdate = 0;
  function updateOfflineFleetDensity(force = false) {
    const now = performance.now();
    if (!force && now - lastFleetDensityUpdate < 500) return;
    lastFleetDensityUpdate = now;

    const height = viewer.camera.positionCartographic
      ? viewer.camera.positionCartographic.height
      : 1.0e7;
    let visibleTarget = 16000;
    if (height > 2.8e7) visibleTarget = 650;
    else if (height > 1.5e7) visibleTarget = 900;
    else if (height > 7.0e6) visibleTarget = 1300;
    else if (height > 3.0e6) visibleTarget = 1900;

    for (let i = 0; i < entities.length; i++) {
      const entity = entities[i];
      entity.show = i < visibleTarget;
    }
  }

  viewer.camera.changed.addEventListener(() => updateOfflineFleetDensity());

    ctx.beginPath();
    points.forEach(([lon, lat], i) => {

      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = fillStyle;
    ctx.fill();
    if (strokeStyle) {

      ctx.lineWidth = 2;

  function makeEarthTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 2048;
  canvas.height = 1024;
  const ctx = canvas.getContext("2d");

  const fallback = ctx.createLinearGradient(0, 0, 0, canvas.height);
  fallback.addColorStop(0, "#54b9e8");
  fallback.addColorStop(0.5, "#2389bd");
  fallback.addColorStop(1, "#0c4e7c");
  ctx.fillStyle = fallback;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const img = new Image();
  img.onload = function () {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.filter = "brightness(1.75) saturate(1.22) contrast(1.12)";
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    ctx.filter = "none";

    // Correct the southern polar land color: keep the blue ocean, but make
    // green/brown Antarctic land white, like a snow/ice-covered continent.
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const px = imageData.data;
    for (let y = 0; y < canvas.height; y++) {
      const latitude = 90 - (y / canvas.height) * 180;
      if (latitude > -55) continue;

      for (let x = 0; x < canvas.width; x++) {
        const i = (y * canvas.width + x) * 4;
        const r = px[i], g = px[i + 1], b = px[i + 2];

        // Green/brown land tends to have noticeably more red/green than blue.
        // Blue ocean is preserved.
        const landLike = (g > b * 1.08 && r > b * 0.72) ||
                         (r > 95 && g > 85 && b < 95);

        if (landLike) {
          px[i] = 248;
          px[i + 1] = 250;
          px[i + 2] = 252;
        }
      }
    }
    ctx.putImageData(imageData, 0, 0);

    // Force Cesium to redraw after the real texture replaces the fallback.
    if (typeof viewer !== "undefined" && viewer.scene) {
      viewer.scene.requestRender();
    }
  };
  img.onerror = function () {
    console.warn("Earth texture decode failed; keeping bright fallback Earth.");
  };
  img.src = REAL_EARTH_TEXTURE;

  return canvas;
}


  function createProceduralEarth() {
    const textureCanvas = makeEarthTexture();
    const radius = 6378137.0;

    const geometry = new Cesium.EllipsoidGeometry({
      radii: new Cesium.Cartesian3(radius, radius, radius * 0.99664719),
      vertexFormat: Cesium.VertexFormat.POSITION_AND_ST
    });

    const material = Cesium.Material.fromType('Image', {
      image: textureCanvas,
      repeat: new Cesium.Cartesian2(1.0, 1.0)
    });
    material.uniforms.color = Cesium.Color.WHITE;

    customEarthModel = viewer.scene.primitives.add(new Cesium.Primitive({
      geometryInstances: new Cesium.GeometryInstance({ geometry }),
      appearance: new Cesium.MaterialAppearance({
        material,
        faceForward: true,
        closed: true,
        translucent: false
      }),
      modelMatrix: Cesium.Matrix4.IDENTITY,
      asynchronous: false,
      show: true
    }));

    // A second, slightly larger transparent shell gives the planet a blue
    // atmospheric rim without requiring another texture or asset.
    const atmosphereGeometry = new Cesium.EllipsoidGeometry({
      radii: new Cesium.Cartesian3(radius * 1.012, radius * 1.012, radius * 1.008),
      vertexFormat: Cesium.VertexFormat.POSITION_NORMAL
    });
    const atmosphereMaterial = Cesium.Material.fromType('Color', {
      color: Cesium.Color.fromCssColorString('#49bfff').withAlpha(0.10)
    });
    earthAtmosphere = viewer.scene.primitives.add(new Cesium.Primitive({
      geometryInstances: new Cesium.GeometryInstance({ geometry: atmosphereGeometry }),
      appearance: new Cesium.MaterialAppearance({
        material: atmosphereMaterial,
        faceForward: true,
        closed: true,
        translucent: true
      }),
      modelMatrix: Cesium.Matrix4.IDENTITY,
      asynchronous: false,
      show: true
    }));

    // Show the custom Earth itself. It uses the embedded real-world
    // coastline texture, so it does not depend on Cesium imagery loading.
    viewer.scene.globe.show = false;
    customEarthModel.show = true;
    if (earthAtmosphere) earthAtmosphere.show = true;
    document.getElementById('earthLoading').classList.remove('visible');
    console.info('Real-world textured Earth enabled.');
  }

  try {
    createProceduralEarth();
  createEarthAtmosphere();
  } catch (error) {
    console.error('Procedural Earth failed; restoring Cesium globe.', error);
    viewer.scene.globe.show = !customEarthModel;
    if (customEarthModel) customEarthModel.show = true;
    const loading = document.getElementById('earthLoading');
    loading.textContent = 'Custom Earth unavailable • using Cesium Earth';
    setTimeout(() => loading.classList.remove('visible'), 2200);
  }

  // Camera helpers ---------------------------------------------------------
  // Cesium already supports mouse-wheel zoom, pinch zoom, drag rotation and
  // right-drag zoom. These helpers add visible controls and a reliable
  // whole-Earth starting view so the globe is never accidentally left too far
  // away or focused only on a satellite.
  const EARTH_VIEW = {
    longitude: 78,
    latitude: 18,
    height: 12500000
  };

  function smoothFlyTo(options, duration = 1.8) {
    // Cancel any previous camera animation first. This prevents competing
    // transitions from making the camera jump or stutter.
    if (viewer.camera.cancelFlight) {
      viewer.camera.cancelFlight();
    }

    viewer.camera.flyTo({
      ...options,
      duration,
      easingFunction: Cesium.EasingFunction.QUINTIC_IN_OUT
    });
  }

  function showWholeEarth(instant = false) {
    const destination = Cesium.Cartesian3.fromDegrees(
      EARTH_VIEW.longitude,
      EARTH_VIEW.latitude,
      12500000
    );

    if (instant) {
      viewer.camera.setView({
        destination,
        orientation: {
          heading: 0,
          pitch: Cesium.Math.toRadians(-90),
          roll: 0
        }
      });
      return;
    }

    smoothFlyTo({
      destination,
      orientation: {
        heading: 0,
        pitch: Cesium.Math.toRadians(-90),
        roll: 0
      }
    }, 1.8);
  }

  function zoomEarth(factor) {
    const distance = viewer.camera.positionCartographic.height;
    const targetHeight = Cesium.Math.clamp(
      distance * factor,
      7000000,
      50000000
    );

    const carto = viewer.camera.positionCartographic;

    smoothFlyTo({
      destination: Cesium.Cartesian3.fromRadians(
        carto.longitude,
        carto.latitude,
        targetHeight
      ),
      orientation: {
        heading: viewer.camera.heading,
        pitch: viewer.camera.pitch,
        roll: viewer.camera.roll
      }
    }, 0.65);
  }

  function initializeSatellites(tleText) {
    const rawLines = tleText.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
    const records = [];

    for (let i = 0; i < rawLines.length;) {
      try {
        if (rawLines[i].startsWith('1 ') && rawLines[i + 1]?.startsWith('2 ')) {
          records.push({
            name: `NORAD ${rawLines[i].substring(2, 7).trim()}`,
            line1: rawLines[i],
            line2: rawLines[i + 1]
          });
          i += 2;
        } else if (
          i + 2 < rawLines.length &&
          rawLines[i + 1].startsWith('1 ') &&
          rawLines[i + 2].startsWith('2 ')
        ) {
          records.push({
            name: rawLines[i],
            line1: rawLines[i + 1],
            line2: rawLines[i + 2]
          });
          i += 3;
        } else {
          i += 1;
        }
      } catch {
        i += 1;
      }
    }

    satellites.length = 0;
    entities.length = 0;
    viewer.entities.removeAll();

    viewer.entities.suspendEvents();

    // If we only have the small embedded offline set, build a large visual
    // fleet by phase-shifting the real embedded orbital records. This keeps
    // the offline scene dense and lively without pretending these copies are
    // additional real spacecraft.
    const useOfflineVisualFleet = records.length > 0 && records.length < 100;
    const targetRecords = useOfflineVisualFleet
      ? Array.from({ length: Math.min(OFFLINE_VISUAL_FLEET_SIZE, MAX_VISIBLE_SATELLITES) }, (_, i) => {
          const base = records[i % records.length];
          return { ...base, fleetIndex: i };
        })
      : records;

    let count = 0;
    for (const record of targetRecords) {
      try {
        const { name, line1, line2 } = record;
        const noradId = line1.substring(2, 7).trim();
        const baseSatrec = satellite.twoline2satrec(line1, line2);
        if (!baseSatrec) continue;

        // Spread the visual copies around their orbital paths. The first copy
        // remains an unmodified record, while later copies receive a phase
        // offset so they do not sit on top of one another.
        const fleetIndex = record.fleetIndex || 0;
        // Distribute the offline visual copies across different orbital planes
        // as well as different phases. This prevents thousands of points from
        // collapsing onto a handful of identical tracks and looking mushy.
        const phaseOffset = fleetIndex
          ? ((fleetIndex * 137.50776405) % 360) * Math.PI / 180
          : 0;
        const planeOffset = fleetIndex
          ? ((fleetIndex * 47.381) % 360) * Math.PI / 180
          : 0;
        const inclinationOffset = fleetIndex
          ? ((((fleetIndex * 29.731) % 21) - 10.5) * Math.PI / 180)
          : 0;
        const satrec = fleetIndex
          ? {
              ...baseSatrec,
              meanAnomaly: (baseSatrec.meanAnomaly + phaseOffset) % (2 * Math.PI),
              raan: (baseSatrec.raan + planeOffset) % (2 * Math.PI),
              inclination: Math.max(0.04, Math.min(Math.PI - 0.04, baseSatrec.inclination + inclinationOffset))
            }
          : baseSatrec;

        const displayName = record.fleetIndex
          ? `${name} · OFFLINE-${String(record.fleetIndex + 1).padStart(4, '0')}`
          : name;

        const satData = {
          name: displayName, noradId, satrec, entity: null,
          cachedPosition: undefined,
          lastUpdateMs: 0,
          orbitEntity: null,
          orbitCache: null,
          orbitLastUpdateMs: 0,
          offlineVisualCopy: Boolean(record.fleetIndex),
          displayIndex: count
        };

        satellites.push(satData);

        if (count < MAX_VISIBLE_SATELLITES) {
          createSatelliteEntity(satData, count);
          count++;
        }
      } catch (e) {
        // Ignore malformed individual TLE records and continue loading the catalog.
      }
    }

    viewer.entities.resumeEvents();
    updateOfflineFleetDensity(true);

    // Keep the whole Earth in view on startup instead of opening at a satellite.
    // Start far enough away to show the complete Earth, but close enough
  // that the globe occupies a large part of the screen.
  showWholeEarth(true);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('status').innerText =
      useOfflineVisualFleet
      ? `OFFLINE VISUAL FLEET · ${satellites.length.toLocaleString()} orbital markers · Showing ${count.toLocaleString()}`
      : `Tracking: ${satellites.length.toLocaleString()} Satellites · Showing ${count.toLocaleString()}`;
    viewer.scene.requestRender();
    setTimeout(() => viewer.scene.requestRender(), 250);
  }


  /*
   * REAL-TIME ORBITAL PROPAGATION & COMPONENT MATH ENGINE
   */
  function getSatellitePositionNow(satrec) {
    const time = Cesium.JulianDate.toDate(viewer.clock.currentTime);
    const positionAndVelocity = satellite.propagate(satrec, time);
    if (!positionAndVelocity || !positionAndVelocity.position) return undefined;
    const positionEci = positionAndVelocity.position;
    if (![positionEci.x, positionEci.y, positionEci.z].every(Number.isFinite)) {
      return undefined;
    }

    const gmst = satellite.gstime(time);
    const positionGd = satellite.eciToGeodetic(positionEci, gmst);

    return Cesium.Cartesian3.fromRadians(
      positionGd.longitude,
      positionGd.latitude,
      positionGd.height * 1000
    );
  }

  // Function to calculate exact details when a satellite is selected
  function updateSatelliteDetails(satData) {
    const time = Cesium.JulianDate.toDate(viewer.clock.currentTime);
    const positionAndVelocity = satellite.propagate(satData.satrec, time);

    const pos = positionAndVelocity.position;
    const vel = positionAndVelocity.velocity;

    if (!pos || !vel) return;

    const gmst = satellite.gstime(time);
    const posGd = satellite.eciToGeodetic(pos, gmst);

    // Convert orbital radians to degrees
    const lat = Cesium.Math.toDegrees(posGd.latitude).toFixed(4);
    const lon = Cesium.Math.toDegrees(posGd.longitude).toFixed(4);
    const alt = posGd.height.toFixed(2); // In kilometers

    // Compute velocity scalar speed index: sqrt(x² + y² + z²)
    const speedKms = Math.sqrt(vel.x * vel.x + vel.y * vel.y + vel.z * vel.z);
    const speedKmh = (speedKms * 3600).toFixed(0); // Convert km/s to km/h

    // Inject telemetry parameters into the UI elements
    document.getElementById('selectedName').innerText = satData.name;
    document.getElementById('norad').innerText = satData.noradId;
    document.getElementById('altitude').innerText = `${alt} km`;
    document.getElementById('latitude').innerText = `${lat}°`;
    document.getElementById('longitude').innerText = `${lon}°`;
    document.getElementById('speed').innerText = `${speedKmh} km/h`;
  }

  /*
   * SELECTED SATELLITE ORBIT
   * Only one orbit is drawn at a time, so this adds very little rendering cost.
   */
  function getOrbitSegments(satData) {
    const now = Date.now();
    if (satData.orbitCache && now - satData.orbitLastUpdateMs < ORBIT_UPDATE_INTERVAL_MS) {
      return satData.orbitCache;
    }

    const meanMotion = Math.abs(satData.satrec.no);
    const periodMinutes = (2 * Math.PI) / Math.max(meanMotion, 0.00001);
    const timeNow = Cesium.JulianDate.toDate(viewer.clock.currentTime);
    const segments = [];
    let segment = [];
    let previousLon = null;

    // Sample densely and convert ECI -> Earth-fixed coordinates.  The orbit is
    // then split whenever it crosses the +/-180° meridian so Cesium never draws
    // an artificial straight chord across the Earth.
    for (let i = 0; i <= ORBIT_SAMPLE_COUNT; i++) {
      const minutesFromNow = (i / ORBIT_SAMPLE_COUNT) * periodMinutes;
      const t = new Date(timeNow.getTime() + minutesFromNow * 60000);
      const pv = satellite.propagate(satData.satrec, t);
      if (!pv || !pv.position) continue;

      const gmst = satellite.gstime(t);
      const gd = satellite.eciToGeodetic(pv.position, gmst);
      const lonDeg = Cesium.Math.toDegrees(gd.longitude);
      const latRad = gd.latitude;
      const lonRad = gd.longitude;
      const heightMeters = Math.max(20000, gd.height * 1000 + 15000);

      // If longitude jumps by more than 180°, we crossed the date line.
      // Finish the current segment and start another one instead of drawing
      // a long line through the globe.
      if (previousLon !== null && Math.abs(lonDeg - previousLon) > 180) {
        if (segment.length > 1) segments.push(segment);
        segment = [];
      }

      segment.push(Cesium.Cartesian3.fromRadians(lonRad, latRad, heightMeters));
      previousLon = lonDeg;
    }

    if (segment.length > 1) segments.push(segment);

    satData.orbitCache = segments;
    satData.orbitLastUpdateMs = now;
    return segments;
  }

  function showSatelliteOrbit(satData) {
    // Remove any previous orbit segments.
    if (satData.orbitEntities) {
      satData.orbitEntities.forEach(entity => viewer.entities.remove(entity));
    }
    satData.orbitEntities = [];
    satData.orbitEntity = null;
    satData.orbitCache = null;
    satData.orbitLastUpdateMs = 0;

    // Build separate polylines for each continuous part of the orbit.
    // This prevents the antimeridian from producing a straight line across Earth.
    const segments = getOrbitSegments(satData);
    segments.forEach((positions, index) => {
      const entity = viewer.entities.add({
        id: `orbit-${satData.noradId}-${index}`,
        name: `${satData.name} Orbit`,
        polyline: {
          positions,
          width: 4,
          material: new Cesium.PolylineGlowMaterialProperty({
            glowPower: 0.25,
            taperPower: 0.65,
            color: Cesium.Color.fromCssColorString('#00ffcc')
          }),
          arcType: Cesium.ArcType.NONE,
          clampToGround: false,
          disableDepthTestDistance: Number.POSITIVE_INFINITY
        }
      });
      satData.orbitEntities.push(entity);
    });
  }

  function hideSatelliteOrbit(satData) {
    if (!satData) return;
    if (satData.orbitEntities) {
      satData.orbitEntities.forEach(entity => viewer.entities.remove(entity));
      satData.orbitEntities = [];
    }
    satData.orbitEntity = null;
  }

  /*
   * SELECTION & ACTIVE SEARCH BAR SYSTEM
   */
  let selectedSatellite = null;
  let selectedOriginalColor = Cesium.Color.WHITE;
  let selectedOriginalSize = 3;

  function clearSatelliteHighlight() {
    if (selectedSatellite && selectedSatellite.entity) {
      selectedSatellite.entity.point.color = selectedOriginalColor;
      selectedSatellite.entity.point.pixelSize = selectedOriginalSize;
      selectedSatellite.entity.point.outlineColor =
        Cesium.Color.fromCssColorString('#1a1a1a');
      selectedSatellite.entity.point.outlineWidth = 1;
      selectedSatellite.entity.label.show = false;
    }
  }

  
  let selectedOrbitEntity = null;
  let selectedOrbitGlowEntity = null;

  function clearSelectedOrbitHighlight() {
    if (selectedOrbitEntity) viewer.entities.remove(selectedOrbitEntity);
    if (selectedOrbitGlowEntity) viewer.entities.remove(selectedOrbitGlowEntity);
    selectedOrbitEntity = null;
    selectedOrbitGlowEntity = null;
  }

  function highlightSelectedOrbit(satData) {
    clearSelectedOrbitHighlight();
    if (!satData || !satData.satrec) return;

    const positions = [];
    const now = new Date();

    // One complete orbital-period-style trail around the selected satellite.
    // 240 points gives a smooth line without making the browser heavy.
    const periodMinutes = 180;
    for (let i = -120; i <= 120; i++) {
      const t = new Date(now.getTime() + i * 60000);
      const p = getSatellitePositionNow(satData.satrec, t) ||
        getSatellitePositionNow(satData.satrec);
      if (p) positions.push(p);
    }

    if (positions.length < 2) return;

    // Soft outer glow.
    selectedOrbitGlowEntity = viewer.entities.add({
      name: 'Selected Satellite Orbit Glow',
      polyline: {
        positions: positions,
        width: 14,
        material: new Cesium.PolylineGlowMaterialProperty({
          glowPower: 0.62,
          taperPower: 0.55,
          color: Cesium.Color.fromCssColorString('#ffdf32').withAlpha(0.82)
        }),
        clampToGround: false
      }
    });

    // Bright core orbit.
    selectedOrbitEntity = viewer.entities.add({
      name: 'Selected Satellite Orbit',
      polyline: {
        positions: positions,
        width: 4,
        material: Cesium.Color.fromCssColorString('#fff7a8'),
        clampToGround: false
      }
    });
  }

  function selectSatellite(satData) {
    if (!satData) return;

    // Preserve the previous satellite's normal appearance.
    clearSatelliteHighlight();

    selectedSatellite = satData;

    if (satData.entity) {
      selectedOriginalColor = satData.entity.point.color;
      selectedOriginalSize = satData.entity.point.pixelSize;

      satData.entity.point.color =
        Cesium.Color.fromCssColorString('#fff36a');
      satData.entity.point.pixelSize = 10;
      satData.entity.point.outlineColor =
        Cesium.Color.WHITE;
      satData.entity.point.outlineWidth = 2;
      satData.entity.label.show = true;
    }

    highlightSelectedOrbit(satData);

    const satellitePosition = getSatellitePositionNow(satData.satrec);
    if (!satellitePosition) return;

    // Put the camera outside the satellite and look inward toward it.
    // The Earth therefore remains naturally behind the selected satellite.
    const radial = Cesium.Cartesian3.normalize(
      satellitePosition,
      new Cesium.Cartesian3()
    );

    const satelliteRadius = Cesium.Cartesian3.magnitude(satellitePosition);
    const cameraDistance = Math.max(
      satelliteRadius + 3000000,
      satelliteRadius * 1.28
    );

    const destination = Cesium.Cartesian3.multiplyByScalar(
      radial,
      cameraDistance,
      new Cesium.Cartesian3()
    );

    const direction = Cesium.Cartesian3.normalize(
      Cesium.Cartesian3.subtract(
        satellitePosition,
        destination,
        new Cesium.Cartesian3()
      ),
      new Cesium.Cartesian3()
    );

    // Stable camera frame: look directly at the satellite,
    // while keeping Earth's north direction at the top of the screen.
    // This avoids the 180-degree flip that can happen near polar orbits.
    const worldUp = Cesium.Cartesian3.UNIT_Z;
    let up = Cesium.Cartesian3.clone(worldUp);

    // If looking almost parallel to world-up, use the satellite's radial
    // direction as a safe secondary reference.
    const parallel = Math.abs(Cesium.Cartesian3.dot(direction, up));
    if (parallel > 0.94) {
      up = Cesium.Cartesian3.normalize(
        satellitePosition,
        new Cesium.Cartesian3()
      );
    }

    smoothFlyTo({
      destination,
      orientation: {
        direction,
        up
      }
    }, 2.2);

    updateSatelliteDetails(satData);
  }

  function locateSatellite(searchTerm) {
    if (!searchTerm) return;

    const cleanTerm = searchTerm.toUpperCase().trim();
    const found = satellites.find(s =>
      s.name.toUpperCase().includes(cleanTerm) ||
      String(s.noradId) === cleanTerm
    );

    if (found) {
      // The catalog can contain thousands of satellites, while only a capped
      // number are initially drawn for performance. Create a searched
      // satellite on demand so it is ALWAYS visible and highlightable.
      if (!found.entity) {
        createSatelliteEntity(found, entities.length);
      }

      selectSatellite(found);
      document.getElementById('status').innerText =
        `Located: ${found.name} (${found.noradId})`;
    } else {
      document.getElementById('status').innerText =
        'Satellite not found in active dataset group.';
    }
  }

  document.getElementById('searchButton').addEventListener('click', () => {
    locateSatellite(document.getElementById('searchBox').value);
  });

  document.getElementById('searchBox').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') locateSatellite(e.target.value);
  });

  // Refresh selected telemetry a few times per second instead of every
  // render frame. This avoids unnecessary SGP4 calculations.
  let lastTelemetryUpdate = 0;
  viewer.clock.onTick.addEventListener(() => {
    if (selectedSatellite) {
      const now = performance.now();
      if (now - lastTelemetryUpdate >= 500) {
        updateSatelliteDetails(selectedSatellite);
        lastTelemetryUpdate = now;
      }
    }
  });

  /*
   * HOVER LABEL TOOLTIP ENGINE
   */
  const hoverLabel = document.getElementById('hoverLabel');
  const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

  const DEFAULT_POINT_COLOR = Cesium.Color.fromCssColorString('#ffffff');
  let hoveredEntity = null;

  function resetHoveredEntity() {
    if (hoveredEntity && hoveredEntity.point) {
      if (selectedSatellite && hoveredEntity === selectedSatellite.entity) {
        hoveredEntity.point.color = Cesium.Color.fromCssColorString('#fff36a');
        hoveredEntity.point.pixelSize = 10;
      } else {
        hoveredEntity.point.color = DEFAULT_POINT_COLOR;
        hoveredEntity.point.pixelSize = 7.5;
      }
    }
    hoveredEntity = null;
  }

  // Only ever touches the one entity under the cursor, not the whole
  // catalog - resetting all 1000 points on every mousemove is the kind
  // of thing that's invisible at 10 satellites and very visible at 1000.
  handler.setInputAction((movement) => {
    const pickedObject = viewer.scene.pick(movement.endPosition);

    if (Cesium.defined(pickedObject) && pickedObject.id && pickedObject.id.satData) {
      if (hoveredEntity && hoveredEntity !== pickedObject.id) {
        resetHoveredEntity();
      }

      hoverLabel.style.display = 'block';
      hoverLabel.style.left = (movement.endPosition.x + 15) + 'px';
      hoverLabel.style.top = (movement.endPosition.y + 15) + 'px';
      hoverLabel.innerText = pickedObject.id.name;

      if (selectedSatellite && pickedObject.id === selectedSatellite.entity) {
        pickedObject.id.point.color = Cesium.Color.fromCssColorString('#fff36a');
        pickedObject.id.point.pixelSize = 7.5;
      } else {
        pickedObject.id.point.color = Cesium.Color.WHITE;
        pickedObject.id.point.pixelSize = 7.5;
      }
      hoveredEntity = pickedObject.id;
    } else {
      hoverLabel.style.display = 'none';
      resetHoveredEntity();
    }
  }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

  // Click handler for satellite selection. The handler is deliberately
  // tolerant of Cesium returning either an Entity or a picked primitive.
  handler.setInputAction((click) => {
    const pickedObject = viewer.scene.pick(click.position);
    const pickedEntity = pickedObject && (
      pickedObject.id ||
      pickedObject.primitive?.id
    );

    const satData = pickedEntity && (
      pickedEntity.satData ||
      pickedEntity.satelliteData ||
      pickedEntity.properties?.satelliteData?.getValue?.(Cesium.JulianDate.now())
    );

    if (satData) {
      selectSatellite(satData);
      return;
    }

    // Do not clear a selection merely because the user clicked the
    // highlighted orbit or the Earth background.
    if (selectedSatellite) {
      return;
    }
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

  // Camera controls. Mouse wheel / trackpad zoom remains enabled too.
  document.getElementById('zoomIn').addEventListener('click', () => zoomEarth(0.65));
  document.getElementById('zoomOut').addEventListener('click', () => zoomEarth(1.55));
  document.getElementById('earthView').addEventListener('click', () => showWholeEarth());

  window.addEventListener('keydown', (event) => {
    // Don't steal +/- keys while the user is typing in the search box.
    if (document.activeElement === document.getElementById('searchBox')) return;

    if (event.key === '+' || event.key === '=') {
      event.preventDefault();
      zoomEarth(0.65);
    } else if (event.key === '-' || event.key === '_') {
      event.preventDefault();
      zoomEarth(1.55);
    } else if (event.key.toLowerCase() === 'h') {
      event.preventDefault();
      showWholeEarth();
    }
  });

  // START THE 3D SCENE FIRST.
  // Satellite networking must never be allowed to block Earth/camera startup.
  showWholeEarth(true);

  const loadingEl = document.getElementById('loading');
  const statusEl = document.getElementById('status');

  loadingEl.style.display = 'none';
  statusEl.innerText = '3D Earth ready · Loading satellite catalog…';

  // Let Cesium render the Earth before starting network work.
  requestAnimationFrame(() => {
    setTimeout(() => {
      fetchSatellites().catch((err) => {
        console.error('Satellite startup failed:', err);
        statusEl.innerText =
          '3D Earth ready · Satellite feed unavailable';
        loadingEl.style.display = 'none';
      });
    }, 100);
  });
</script>
